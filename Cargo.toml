[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hivevm/forager"
publish = false

[workspace.dependencies]
forager-style-ir = { path = "crates/style-ir" }
forager-ports = { path = "crates/ports" }
forager-mapfile = { path = "crates/mapfile" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"
