[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hivevm/forager"
publish = false

[workspace.dependencies]
forager-style-ir = { path = "crates/style-ir" }
forager-ports = { path = "crates/ports" }
forager-mapfile = { path = "crates/mapfile" }
forager-expr = { path = "crates/expr" }
forager-render = { path = "crates/render" }
forager-render-agg = { path = "crates/render-agg" }
forager-label = { path = "crates/label" }
forager-symbolize = { path = "crates/symbolize" }
forager-encode = { path = "crates/encode" }
forager-engine = { path = "crates/engine" }
forager-adapter-geojson = { path = "crates/adapter-geojson" }
forager-adapter-epsg = { path = "crates/adapter-epsg" }
forager-adapter-shapefile = { path = "crates/adapter-shapefile" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: every number of a style document reads back bit for bit (G-3).
serde_json = { version = "1", features = ["float_roundtrip"] }
serde-saphyr = "2"
# Reports each key a reader ignores with its path (ADR-0014).
serde_ignored = "0.1.14"
# Names the path at which a typed read failed, so that a newer minor's unknown value is dropped
# there and any other read error names its place (ADR-0014).
serde_path_to_error = "0.1.20"
# Derives the JSON Schema of the style document, behind style-ir's `schema` feature (ADR-0014).
schemars = "1.2.3"
wasm-bindgen = "0.2.129"
# The same pure-Rust sin, cos, and acos on every target, where std's call the platform's libm and
# may differ in the last bit between the native and the browser build (Q-2). Without `arch`, its
# default, every target runs the same generic code.
libm = { version = "0.2.16", default-features = false }
# Encodes and decodes PNG in `encode` (ADR-0030); the CLI's tests decode the reference images with
# it, so that the encoder and the harness read one version.
png = "0.18.1"
# Runs the browser bindings' wasm32 build in the CLI's conformance test, compared with the native
# render (G-9, ADR-0034); a dev-dependency of the CLI alone.
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "portable-dispatch"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"
# No stray debug output (AGENTS.md §5), in tests too: each deliberate output says so where it
# stands, with #[expect(clippy::print_stdout, reason = "...")].
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
# A str sliced at an index that may not stand on a character's boundary panics; each slice states
# its boundary or says in its #[expect] why the index stands on one. Test code may allow it.
string_slice = "warn"
# The bans of clippy.toml (Q-2) bind the IR and the core alone; each of their crates warns these
# lints at the top of its lib.rs.
disallowed_types = "allow"
disallowed_methods = "allow"

# The browser bundle is downloaded by every map viewer (Q-5): scripts/build-web.sh builds it with
# this profile, optimized for size; other release builds keep the default.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

# The interpreter of the conformance test's wasm32 module (ADR-0034) runs optimized in the test
# build; unoptimized it takes about nine minutes for the cases in scope.
[profile.dev.package.wasmi]
opt-level = 3
[profile.dev.package.wasmi_core]
opt-level = 3
[profile.dev.package.wasmi_ir]
opt-level = 3
