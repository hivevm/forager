[package]
name = "forager-bindings-wasm"
description = "The WebAssembly bindings of Forager for the browser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The module the conformance test runs in wasmi and compares with the native render (G-9,
# ADR-0034): exports of plain integers beside the browser API, which the bundle leaves out.
conformance = []

[dependencies]
forager-style-ir.workspace = true
forager-ports.workspace = true
forager-mapfile.workspace = true
forager-engine.workspace = true
forager-render.workspace = true
forager-render-agg.workspace = true
forager-adapter-geojson.workspace = true
forager-adapter-epsg.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true

[dev-dependencies]
forager-encode.workspace = true

[lints]
workspace = true
