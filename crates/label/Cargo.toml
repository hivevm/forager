[package]
name = "forager-label"
description = "Lays out and draws a label's text: glyphs read with skrifa as MapServer reads them with FreeType (ADR-0028)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
forager-render.workspace = true
libm.workspace = true
# The one crate that reads fonts (ADR-0028); without its default autohinter shaping, which an
# unhinted glyph never uses.
skrifa = { version = "0.49.0", default-features = false, features = ["std"] }

[dev-dependencies]
# Measures what the label cache allocates (Q-9).
peak_alloc = "0.3.0"

[lints]
workspace = true
