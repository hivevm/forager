[package]
name = "forager-label"
description = "Lays out and draws a label's text: glyphs read with skrifa as MapServer reads them with FreeType (REN-label-glyphs-from-skrifa)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
forager-render.workspace = true
# C's small ports, the `(int)` cast among them (IR-c-ports-in-style-ir).
forager-style-ir.workspace = true
libm.workspace = true
# The one crate that reads fonts (REN-label-glyphs-from-skrifa); without its default autohinter shaping, which an
# unhinted glyph never uses.
skrifa = { version = "0.49.0", default-features = false, features = ["std"] }

[dev-dependencies]
# Measures what the label cache allocates (Q-9).
peak_alloc = "0.3.0"

[lints]
workspace = true
