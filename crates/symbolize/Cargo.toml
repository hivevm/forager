[package]
name = "forager-symbolize"
description = "Symbolizes a style: a feature's geometry in a style turned into drawing operations, as MapServer draws it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
forager-style-ir.workspace = true
forager-render.workspace = true
libm.workspace = true
# Tests a simplified polygon's validity and repairs it by a union, for a `GEOMTRANSFORM`
# (ADR-draft-geometry-through-geo); its default features are off, so it brings no threads and no
# triangulation.
geo = { version = "0.33.1", default-features = false }

[lints]
workspace = true
