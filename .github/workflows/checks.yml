name: Checks

# Enforces the repository's rules as CI. Pure bash + coreutils — nothing is installed but
# ShellCheck, which the shell job installs at the version scripts/install-shellcheck.sh pins
# (ADR-0007), and the toolchain of the rust job. scripts/check-all.sh is the local equivalent;
# check 9 of scripts/check-docs.sh holds its list, the jobs of this workflow, and the required
# checks named in CONTRIBUTING.md together. Each job runs a check after its own self-test, and
# each script's header says what it checks and which ADR it holds.
#
# The sensors report for the reviewer and fail on nothing they count, except the action
# references, which this project runs with --require major-tag as the check of ADR-0010; their
# self-tests fail like any check's. The sensors job checks out the full history because five
# sensors read it. The review binding sensor runs in review-binding.yml, the repository settings
# sensor on a human's instruction (ADR-0002); this workflow runs the self-test of each.
#
# The build, test, and lint job runs scripts/check-rust.sh after scripts/install-tools.sh
# (ADR-0007) and the self-test of scripts/fuzz.sh, which reads manifests with the toolchain
# installed; the one job of this workflow that installs a toolchain; ~/.cargo/bin and the
# registry are cached, keyed on the files that decide their content, and so is the msautotest
# suite check-rust.sh fetches, keyed on the script that holds its pin.
#
# Every job is bounded by a timeout — a hung step would otherwise occupy a runner until the
# platform's own six-hour limit — and every checkout runs with 'persist-credentials: false': the
# workflow token is needed to fetch the code, not afterwards, and leaving it in .git/config makes
# it readable to every later step and to anything they invoke.

on:
  pull_request:
    # ready_for_review runs check 16 of check-docs.sh again on a draft pull request marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Started by hand on a pushed branch that has no pull request yet, such as a feat/ branch
  # under rework (AGENTS.md, section 6): gh workflow run checks.yml --ref <branch>. GitHub offers
  # it only once this trigger is on the default branch.
  workflow_dispatch:
  # Once a week against main without a change: catches what moves without a commit, the runner
  # image, a retagged action, a toolchain download. GitHub disables a schedule after 60 days
  # without activity in a public repository.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

# Cancel a pull request's superseded runs: a new push makes the previous run's verdict irrelevant,
# while a queued run keeps a required check pending. Runs on 'main' are never cancelled — every
# commit there keeps a result of its own, and the event name keeps a scheduled run out of the group
# of the pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Submodules are checked out because the link check resolves relative targets against the
      # working tree: a documentation link into a submodule would otherwise break in CI while
      # working locally. Their *contents* are never read — check-docs.sh enumerates via
      # `git ls-files`, which lists a submodule as one gitlink entry, not as its files.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      # The check's own tests run first: a check that is wrong passes nothing worth trusting.
      - name: Self-test the documentation checks
        run: bash scripts/test-check-docs.sh
      # Check 16 reads the branch the change lands on from GitHub's own variables: a draft ADR
      # fails on a pull request into main once it is ready for review, and on a push to main
      # (ADR-0002). A draft pull request tests a feat/ branch still under rework, and passes.
      - name: Check documentation consistency
        run: bash scripts/check-docs.sh
        env:
          PULL_REQUEST_DRAFT: ${{ github.event.pull_request.draft }}
      - name: Self-test the map script of the normalize skill
        run: bash scripts/test-normalize-remap.sh
      - name: Self-test the numbering script of the drafts
        run: bash scripts/test-number-adrs.sh
      - name: Self-test the readiness script of the pull request into main
        run: bash scripts/test-ready-for-main.sh
      - name: Self-test the drop script of a merged branch
        run: bash scripts/test-drop-merged-branch.sh

  traceability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The check's own tests run first: a check that is wrong passes nothing worth trusting.
      - name: Self-test the traceability check
        run: bash scripts/test-check-traceability.sh
      - name: Check that accepted decisions and criteria are verified by tests
        run: bash scripts/check-traceability.sh

  devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The check's own tests run first: a check that is wrong passes nothing worth trusting.
      - name: Self-test the Dev Container check
        run: bash scripts/test-check-devcontainer.sh
      - name: Check that the Dev Container keeps the host engine out of reach
        run: bash scripts/check-devcontainer.sh

  sensors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # The sensor's own tests run first: a sensor that is wrong reports nothing worth reading.
      - name: Self-test the tests-kept sensor
        run: bash scripts/test-sensor-tests-kept.sh
      # The base is the pull request's base branch, or the previous tip on a push to main.
      - name: Report test files deleted and skip markers added since the base
        run: bash scripts/sensor-tests-kept.sh "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Self-test the refactor tests sensor
        run: bash scripts/test-sensor-refactor-tests.sh
      - name: Report the commits typed refactor that change a test since the base
        run: bash scripts/sensor-refactor-tests.sh "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Self-test the backlog commits sensor
        run: bash scripts/test-sensor-backlog-commits.sh
      - name: Report the commits that add a backlog entry beside other changes since the base
        run: bash scripts/sensor-backlog-commits.sh "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Self-test the binding ADRs sensor
        run: bash scripts/test-sensor-binding-adrs.sh
      - name: Report the ADRs in force whose Applies to names a path the change touches
        run: bash scripts/sensor-binding-adrs.sh "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Self-test the plain rules sensor
        run: bash scripts/test-sensor-plain-rules.sh
      - name: Report long sentences and soft modal verbs the change adds to the rules
        run: bash scripts/sensor-plain-rules.sh "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Self-test the revision-due sensor
        run: bash scripts/test-sensor-revision-due.sh
      - name: Report the changes since the last design revision
        run: bash scripts/sensor-revision-due.sh
      - name: Self-test the plan frontier sensor
        run: bash scripts/test-sensor-plan-frontier.sh
      - name: Report the tickets that may be claimed, the claimed, and the blocked
        run: bash scripts/sensor-plan-frontier.sh
      - name: Self-test the backlog sensor
        run: bash scripts/test-sensor-backlog.sh
      - name: Report the backlog entries on main and on unmerged local branches
        run: bash scripts/sensor-backlog.sh
      - name: Self-test the action references sensor
        run: bash scripts/test-sensor-action-refs.sh
      # The check of ADR-0010: every action by its major version tag, kept current by Dependabot.
      # Verifies: ADR-0010
      - name: Check that every action is referenced by its major version tag
        run: bash scripts/sensor-action-refs.sh --require major-tag
      # The mutation sensor itself runs weekly (mutants.yml) and in the review; its arguments are
      # decided here, without cargo-mutants.
      - name: Self-test the mutation sensor's arguments
        run: bash scripts/test-mutants.sh
      # How MapServer runs on CI for the noise measurement (noise.yml), decided without building it.
      # Verifies: ADR-0033
      - name: Self-test how MapServer is built and run on CI
        run: bash scripts/test-build-mapserver.sh
      - name: Self-test the vendor check
        run: bash scripts/test-check-vendor.sh
      - name: Check the vendored JavaScript of the browser example against its checksums
        run: bash scripts/check-vendor.sh
      # Two runs of the generator match each other and the browser example's checked-in GeoJSON.
      - name: Self-test the example generator against the checked-in GeoJSON
        run: bash scripts/test-generate-example.sh
      - name: Self-test the MapServer notice check
        run: bash scripts/test-check-notice.sh
      # The licence constraint: a file that follows MapServer's source keeps its notice.
      - name: Check that every file following MapServer's source keeps its notice
        run: bash scripts/check-notice.sh
      # The packaging script itself builds the artefacts on a human's instruction.
      - name: Self-test the check that every binary artefact carries the notices
        run: bash scripts/test-package.sh
      # The fidelity check itself runs in the rust job, after the harness that counts the cases.
      - name: Self-test the fidelity check
        run: bash scripts/test-check-fidelity.sh
      - name: Self-test the review binding sensor
        run: bash scripts/test-sensor-review-binding.sh
      # The repository settings sensor itself runs on a human's instruction (ADR-0002).
      - name: Self-test the repository settings sensor
        run: bash scripts/test-sensor-repo-settings.sh

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install ShellCheck at its pinned version
        run: |
          bash scripts/install-shellcheck.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Self-test the check runner
        run: bash scripts/test-check-all.sh
      - name: Self-test the git hooks
        run: bash scripts/test-git-hooks.sh
      - name: Self-test the ADR index's merge driver
        run: bash scripts/test-merge-adr-index.sh
      - name: Self-test the self-tests' fixture git
        run: bash scripts/test-fixture-git-env.sh
      - name: Self-test the shell lint
        run: bash scripts/test-check-shell.sh
      - name: Lint shell scripts with ShellCheck
        run: bash scripts/check-shell.sh

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The schema check reads the release tags, whose schema files are frozen (ADR-0014), and
          # refuses a shallow checkout, which has none.
          fetch-depth: 0
      # The tools are compiled by cargo install on a cache miss, which takes minutes; the key
      # changes whenever a pinned version can.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/install-tools.sh') }}
      - uses: actions/cache@v6
        with:
          path: target/msautotest
          key: msautotest-${{ hashFiles('scripts/fetch-msautotest.sh') }}
      - name: Install the toolchain and the cargo tools
        run: bash scripts/install-tools.sh
      # The fuzz targets themselves run weekly (fuzz.yml); how they are read and refused is
      # decided here, with the pinned toolchain but without the nightly one or cargo-fuzz.
      - name: Self-test how the fuzz script reads its targets
        run: bash scripts/test-fuzz.sh
      - name: Build, test, and lint the workspace
        run: bash scripts/check-rust.sh
