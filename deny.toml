# cargo-deny configuration (ADR-0012): permissive licences only, RustSec advisories, crates.io as
# the only source. A licence added to `allow` is decided by the maintainer in review (ADR-0007).

[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace crates are not published; their licence is the workspace's.
ignore = true

[advisories]
# Unmaintained crates fail as well as vulnerable ones.
unmaintained = "all"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
