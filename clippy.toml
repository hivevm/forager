# What the output path may not use (Q-2): hash-map iteration order, a clock, a random source, and
# the platform's `hypot`, which libm does not round alike on every target, would make the same input
# render or load differently. The lints are allowed in the workspace and warned by each crate of the
# IR, the core, the ports, the frontend, and the adapters (ADR-0008) at the top of its lib.rs, so
# that only hosts and tooling stay free, beside the integration tests under such a crate's tests/,
# which reach no output. The fuzz workspace takes no workspace lints, so the bans warn there by
# default; it renders through the core and is held to them as well. `engine`, `label`, and
# `symbolize` read their own clippy.toml in place of this one: these lists, which arch-test holds
# them to, and the bans of `min` and `max` of `f64` and `f32`.
disallowed-types = [
  { path = "std::collections::HashMap", reason = "iteration order is random; use BTreeMap (Q-2)" },
  { path = "std::collections::HashSet", reason = "iteration order is random; use BTreeSet (Q-2)" },
  { path = "std::hash::RandomState", reason = "a random source (Q-2)" },
  { path = "std::time::SystemTime", reason = "a clock (Q-2)" },
  { path = "std::time::Instant", reason = "a clock (Q-2)" },
]
disallowed-methods = [
  { path = "std::hash::RandomState::new", reason = "a random source (Q-2)" },
  { path = "std::time::SystemTime::now", reason = "a clock (Q-2)" },
  { path = "std::time::Instant::now", reason = "a clock (Q-2)" },
  { path = "f64::hypot", reason = "the platform's libm, which differs between targets; IEEE's sqrt of the sum of squares is exact everywhere (Q-2)" },
]
