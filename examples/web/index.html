<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forager example</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #dcdcd6;
    --accent: #2f6f4f; --warning: #8a6200; --error: #a12a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161715; --panel: #1f201e; --text: #ececea; --muted: #a3a39d; --line: #34352f;
      --accent: #7cc39b; --warning: #e0b44c; --error: #ef7d7d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
  @media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
            padding: 14px; min-width: 0; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
       margin: 0 0 10px; }
  textarea, input { width: 100%; background: var(--bg); color: var(--text);
                    border: 1px solid var(--line); border-radius: 6px; padding: 8px;
                    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  textarea { resize: vertical; }
  #mapfile { height: 340px; }
  .source { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
  .source label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .source textarea { height: 120px; margin-top: 6px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  button { background: var(--accent); color: var(--bg); border: 0; border-radius: 6px;
           padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent);
                     border: 1px solid var(--accent); }
  canvas { display: block; max-width: 100%; height: auto; border: 1px solid var(--line);
           border-radius: 4px; background: repeating-conic-gradient(var(--line) 0 25%, transparent 0 50%) 0 0 / 16px 16px; }
  #status { color: var(--muted); font-size: 13px; }
  ul#diagnostics { list-style: none; padding: 0; margin: 12px 0 0;
                   font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #diagnostics li { padding: 4px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
  .warning { color: var(--warning); } .error { color: var(--error); }
  section.wide { grid-column: 1 / -1; }
  #tiles { height: 440px; border: 1px solid var(--line); border-radius: 4px;
           background: var(--bg); }
</style>
</head>
<body>
<main>
  <h1>Forager in the browser</h1>
  <p class="lead">A mapfile and GeoJSON for its layers, rendered by Forager's WebAssembly build.
    GeoJSON is bound to the layer whose NAME you give.</p>
  <div class="grid">
    <section>
      <h2>Mapfile</h2>
      <textarea id="mapfile" spellcheck="false" aria-label="Mapfile"></textarea>
      <h2 style="margin-top: 16px">GeoJSON by layer</h2>
      <div id="sources"></div>
      <div class="row">
        <button class="secondary" id="add">Add source</button>
      </div>
    </section>
    <section>
      <h2>Map</h2>
      <canvas id="map" width="640" height="400"></canvas>
      <div class="row">
        <button id="render" disabled>Render</button>
        <span id="status">Loading…</span>
      </div>
      <ul id="diagnostics" aria-live="polite"></ul>
    </section>
    <section class="wide">
      <h2>Tiles</h2>
      <div id="tiles"></div>
    </section>
  </div>
</main>
<script src="vendor/leaflet/leaflet.js"></script>
<script type="module">
  // Imported dynamically, so that a missing bundle is reported on the page.
  let render;
  // The mapfile and sources of the last Render, which the tiles draw until the next one.
  let current;
  let tiles;

  const sources = document.getElementById("sources");
  const status = document.getElementById("status");

  function addSource(layer = "", geojson = "") {
    const row = document.createElement("div");
    row.className = "source";
    row.innerHTML = `<label>Layer NAME</label><input class="layer" spellcheck="false">
      <textarea class="geojson" spellcheck="false" aria-label="GeoJSON"></textarea>`;
    row.querySelector(".layer").value = layer;
    row.querySelector(".geojson").value = geojson;
    sources.append(row);
  }

  function draw() {
    try {
      drawMap();
    } catch (error) {
      status.textContent = `Rendering failed: ${error}`;
    }
  }

  function drawMap() {
    const bound = {};
    for (const row of sources.querySelectorAll(".source")) {
      const layer = row.querySelector(".layer").value.trim();
      if (layer) bound[layer] = row.querySelector(".geojson").value;
    }
    current = { mapfile: document.getElementById("mapfile").value, sources: JSON.stringify(bound) };
    tiles?.redraw();
    const started = performance.now();
    const result = render(current.mapfile, current.sources);
    try {
      show(result, performance.now() - started);
    } finally {
      result.free();
    }
  }

  // A Leaflet layer whose tiles Forager renders, each with the extent of the tile. MapServer's
  // extent runs from the centre of the first pixel to the centre of the last, so the tile's edges
  // are moved in by half a pixel; then neighbouring tiles meet without a seam.
  const ForagerTiles = L.GridLayer.extend({
    createTile(coords) {
      const tile = document.createElement("canvas");
      const size = this.getTileSize();
      tile.width = size.x;
      tile.height = size.y;
      const topLeft = this._map.unproject(coords.scaleBy(size), coords.z);
      const bottomRight = this._map.unproject(coords.add([1, 1]).scaleBy(size), coords.z);
      const half = (bottomRight.lng - topLeft.lng) / size.x / 2;
      const extent = [topLeft.lng + half, bottomRight.lat + half,
                      bottomRight.lng - half, topLeft.lat - half];
      try {
        const result = render(current.mapfile, current.sources, size.x, size.y, extent);
        try {
          if (result.width > 0) {
            const pixels = new Uint8ClampedArray(result.pixels);
            const image = new ImageData(pixels, result.width, result.height);
            tile.getContext("2d").putImageData(image, 0, 0);
          }
        } finally {
          result.free();
        }
      } catch (error) {
        console.error(error);
      }
      return tile;
    },
  });

  // The tile view in plain map units, framed once at load by the first EXTENT line of the
  // mapfile, which in the sample is the map's.
  function showTiles() {
    const map = L.map("tiles", { crs: L.CRS.Simple, minZoom: -4, maxZoom: 10 });
    const line = current.mapfile.match(/^\s*EXTENT\s+(\S+)\s+(\S+)\s+(\S+)\s+(\S+)/im);
    const [minx, miny, maxx, maxy] = line ? line.slice(1).map(Number) : [];
    if ([minx, miny, maxx, maxy].every(Number.isFinite)) {
      map.fitBounds([[miny, minx], [maxy, maxx]]);
    } else {
      map.setView([0, 0], 0);
    }
    tiles = new ForagerTiles().addTo(map);
  }

  function show(result, elapsed) {
    const canvas = document.getElementById("map");
    const context = canvas.getContext("2d");
    if (result.width > 0) {
      canvas.width = result.width;
      canvas.height = result.height;
      const image = new ImageData(new Uint8ClampedArray(result.pixels), result.width, result.height);
      context.putImageData(image, 0, 0);
    } else {
      context.clearRect(0, 0, canvas.width, canvas.height);
    }
    const list = document.getElementById("diagnostics");
    list.replaceChildren();
    for (const d of JSON.parse(result.diagnostics)) {
      const item = document.createElement("li");
      item.className = d.severity;
      item.textContent = `${d.span ? d.span + ": " : ""}${d.severity} [${d.code}]: ${d.message}`;
      list.append(item);
    }
    status.textContent = result.width > 0
      ? `${result.width} × ${result.height} px in ${elapsed.toFixed(1)} ms`
      : "The map could not be drawn; see the diagnostics.";
  }

  async function text(path) {
    const response = await fetch(path);
    return response.ok ? response.text() : "";
  }

  document.getElementById("add").addEventListener("click", () => addSource());

  try {
    const bundle = await import("./pkg/forager_bindings_wasm.js");
    await bundle.default();
    render = bundle.render;
  } catch (error) {
    status.textContent =
      "The WebAssembly bundle did not load; run `bash scripts/build-web.sh` and reload.";
    throw error;
  }
  const renderButton = document.getElementById("render");
  renderButton.addEventListener("click", draw);
  renderButton.disabled = false;
  document.getElementById("mapfile").value = await text("sample.map");
  for (const layer of ["areas", "roads", "places"]) {
    addSource(layer, await text(`${layer}.geojson`));
  }
  draw();
  showTiles();
</script>
</body>
</html>
